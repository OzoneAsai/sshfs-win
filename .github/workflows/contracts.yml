name: Source contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Packaging and Windows tooling contracts
        run: |
          set -euo pipefail
          python3 tests/packaging-standard-contract-test.py
          python3 tests/windows-tooling-static-test.py
          python3 tests/launcher-registry-transaction-test.py
          python3 tests/native-argv-authority-test.py

      - name: Source and distribution contracts
        run: |
          set -euo pipefail
          bash tests/patch-series-contract-test.sh
          bash tests/source-archive-self-contained-test.sh
          bash tests/artifact-hygiene-test.sh
          bash tests/dist-signing-contract-test.sh

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find tools tests -type f -name '*.sh' -print | sort)

      - name: Select C23 compiler mode
        run: |
          set -euo pipefail
          probe='int main(void) { return 0; }'
          if printf '%s\n' "$probe" | gcc -std=gnu23 -x c -c -o /tmp/c23-probe.o - 2>/dev/null; then
            echo 'CSTD=gnu23' >> "$GITHUB_ENV"
          elif printf '%s\n' "$probe" | gcc -std=gnu2x -x c -c -o /tmp/c23-probe.o - 2>/dev/null; then
            echo 'CSTD=gnu2x' >> "$GITHUB_ENV"
          else
            echo 'GCC does not provide a usable GNU C23 mode' >&2
            exit 1
          fi

      - name: Wrapper strict compile
        run: |
          set -euo pipefail
          gcc -std="$CSTD" -Wall -Wextra -Werror -I. -c sshfs-win.c -o /tmp/sshfs-win.o

      - name: Strict C contract tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/sshfs-win-tests
          for src in tests/*.c; do
            exe="/tmp/sshfs-win-tests/$(basename "${src%.c}")"
            echo "[strict/$CSTD] $src"
            gcc -std="$CSTD" -Wall -Wextra -Werror -pthread "$src" -ldl -o "$exe"
            "$exe"
          done

      - name: ASan and UBSan C contract tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          rm -rf /tmp/sshfs-win-tests-sanitized
          mkdir -p /tmp/sshfs-win-tests-sanitized
          for src in tests/*.c; do
            exe="/tmp/sshfs-win-tests-sanitized/$(basename "${src%.c}")"
            echo "[asan+ubsan/$CSTD] $src"
            gcc -std="$CSTD" -Wall -Wextra -Werror -pthread \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$src" -ldl -o "$exe"
            "$exe"
          done

  cygwin-core:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CYGWIN_NOWINPATH: 1
    steps:
      - name: Keep checkout bytes Unix-clean
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Cygwin build environment
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: >-
            git
            gcc-core
            meson
            ninja
            libglib2.0-devel
            pkg-config

      - name: Install locked WinFsp 2.1.25156
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          $expected = '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a'
          $actual = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "WinFsp MSI hash mismatch: expected=$expected actual=$actual"
          }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msi, '/qn', 'INSTALLLEVEL=1000', '/norestart'
          )
          if ($p.ExitCode -notin @(0, 3010)) {
            throw "WinFsp MSI installation failed: exit=$($p.ExitCode)"
          }

      - name: Install WinFsp Cygwin FUSE bridge
        shell: bash -o igncr -e -o pipefail {0}
        run: |
          set -euo pipefail
          bridge='/cygdrive/c/Program Files (x86)/WinFsp/opt/cygfuse/install.sh'
          test -f "$bridge"
          bash "$bridge"
          pkg-config --modversion fuse3

      - name: Compile Cygwin wrapper and patched SSHFS core
        shell: bash -o igncr -e -o pipefail {0}
        run: |
          set -euo pipefail
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$workspace"

          echo '[cygwin] wrapper'
          gcc -Wall -Wextra -Werror -I. -o /tmp/sshfs-win.exe sshfs-win.c

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tools/stage-sshfs-source.sh "$workspace/sshfs" "$work/sshfs"

          echo '[cygwin] patch series'
          while IFS= read -r name || test -n "$name"; do
            case "$name" in ''|\#*) continue ;; esac
            patch="$workspace/patches/$name"
            test -f "$patch"
            tmp=$(mktemp)
            sed 's/\r$//' < "$patch" > "$tmp"
            git -C "$work/sshfs" apply --check --whitespace=error-all "$tmp"
            git -C "$work/sshfs" apply --whitespace=error-all "$tmp"
            rm -f "$tmp"
          done < patches/SERIES

          echo '[cygwin] meson+ninja'
          cd "$work/sshfs"
          meson setup build --wrap-mode=nodownload
          ninja -C build
          test -x build/sshfs.exe

  wix-v7:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors -join '; ')" -ErrorAction Continue
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }

      - name: Show .NET SDK
        shell: pwsh
        run: dotnet --info

      - name: Create runtime fixture
        id: fixture
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sshfs-win-root-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force (Join-Path $root 'bin'), (Join-Path $root 'etc') | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'bin\sshfs-win.exe') -Value 'fixture-wrapper' -NoNewline
          Set-Content -LiteralPath (Join-Path $root 'bin\sshfs.exe') -Value 'fixture-core' -NoNewline
          Set-Content -LiteralPath (Join-Path $root 'etc\runtime-origins.tsv') -Value "sshfs-win.exe`tfixture`tfixture" -NoNewline
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Build WiX v7 fixture MSI
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $sep = [IO.Path]::DirectorySeparatorChar
          $out = (Join-Path $env:RUNNER_TEMP "wix-out-${{ matrix.arch }}") + $sep
          $obj = (Join-Path $env:RUNNER_TEMP "wix-obj-${{ matrix.arch }}") + $sep
          dotnet build .\sshfs-win.wixproj `
            --configuration Release `
            "--property:InstallerPlatform=${{ matrix.arch }}" `
            "--property:OutputName=sshfs-win-$version-${{ matrix.arch }}" `
            "--property:OutputPath=$out" `
            "--property:IntermediateOutputPath=$obj" `
            "--property:MyProductName=SSHFS-Win" `
            "--property:MyCompanyName=OzoneAsai" `
            "--property:MyDescription=Modernized SSHFS for Windows" `
            "--property:MyProductVersion=$version Preview" `
            "--property:MyProductStage=Beta" `
            "--property:MyVersion=$version" `
            "--property:RootDir=${{ steps.fixture.outputs.root }}"
          $msi = Join-Path $out "sshfs-win-$version-${{ matrix.arch }}.msi"
          if (-not (Test-Path -LiteralPath $msi)) {
            throw "WiX v7 build did not produce expected MSI: $msi"
          }
          Get-Item -LiteralPath $msi | Format-List FullName, Length
